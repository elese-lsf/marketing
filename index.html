  if(ROL!=='docente')return;
  if(e.target&&e.target.tagName==='INPUT'&&e.target.type==='range')return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);
  else if(e.key==='Home')go(0);else if(e.key==='End')go(R.length-1);
});
window.addEventListener('hashchange',function(){if(ROL!=='docente')return;var i=fromHash();if(i!==cur)go(i)});

/* ---------- vista alumno ---------- */
var UID=null;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function uid(){if(UID)return UID;UID=lsGet('matequo_uid');if(!UID){UID='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);lsSet('matequo_uid',UID)}return UID}
function mine(id){try{var v=JSON.parse(lsGet('matequo_'+SALA+'_'+id)||'[]');return Array.isArray(v)?v.map(String):[]}catch(e){return []}}
function setMine(id,a){lsSet('matequo_'+SALA+'_'+id,JSON.stringify(a))}
var MSGHINT={};
function pollHtml(id){
  var P=POLLS[id],m=mine(id);
  var hint=P.tipo==='multi'?'Podés elegir hasta '+P.max+' ('+m.length+' de '+P.max+').':'Tocá una opción. Podés cambiar tu voto.';
  return '<div class="step"><h3>'+P.t+'</h3>'+P.op.map(function(o){return '<button class="opt'+(m.indexOf(o[0])>-1?' on':'')+'" data-act="vote" data-p="'+id+'" data-v="'+o[0]+'">'+o[1]+'</button>'}).join('')+'<div class="muted" id="h_'+id+'">'+(MSGHINT[id]||hint)+'</div></div>';
}
function renderAlumno(){
  if(cur===null){$('title').textContent='Matequo';$('main').innerHTML='<div class="stu"><div class="card lead"><b>Esperando que el docente empiece…</b><div class="muted">Esta pantalla se actualiza sola.</div></div></div>';return}
  $('title').textContent=LAB[cur]+' · '+TIT[cur];
  var ps=pollsOf(cur);
  $('main').innerHTML='<div class="stu">'+(ps.length?ps.map(pollHtml).join(''):'<div class="card lead"><b>Mirá la pantalla del aula.</b><div class="muted">En esta parte no hay votación.</div></div>')+'</div>';
}
function sendVote(id,v){
  var P=POLLS[id],a=mine(id);
  if(P.tipo==='una')a=[v];
  else{var i=a.indexOf(v);if(i>-1)a.splice(i,1);else{a.push(v);if(a.length>P.max)a.shift()}}
  setMine(id,a);MSGHINT[id]='Enviando…';renderAlumno();
  var p=a.length?jput('/votos/'+id+'/'+uid(),P.tipo==='una'?a[0]:a):jdel('/votos/'+id+'/'+uid());
  p.then(function(){MSGHINT[id]=a.length?'Voto enviado ✓':'Voto retirado.';setNet(true);renderAlumno()}).catch(function(){MSGHINT[id]='No se pudo enviar. Revisá tu conexión y volvé a tocar.';setNet(false);renderAlumno()});
}
function pollEstado(){
  jget('/estado').then(function(e){
    setNet(true);
    if(!e||typeof e!=='object'){return}
    var rp=e.rp&&typeof e.rp==='object'?e.rp:{},changed=false;
    POLLIDS.forEach(function(id){var k='matequo_rp_'+SALA+'_'+id;if(rp[id]&&String(rp[id])!==lsGet(k)){lsSet(k,String(rp[id]));setMine(id,[]);changed=true}});
    var p=parseInt(e.p,10);
    if(!isNaN(p)&&p>=0&&p<R.length&&p!==cur){cur=p;changed=true}
    if(changed)renderAlumno();
  }).catch(function(){setNet(false)});
}
function startAlumno(){
  document.body.classList.add('alumno');
  $('statR').textContent='Matequo · '+SALA;
  cur=null;renderAlumno();
  $('main').addEventListener('click',function(e){var t=e.target.closest('[data-act="vote"]');if(!t)return;sendVote(t.getAttribute('data-p'),t.getAttribute('data-v'))});
  pollEstado();setInterval(pollEstado,2000);
}

/* ---------- vista docente ---------- */
function studentUrl(){var u=location.protocol==='file:'?location.href.split('?')[0]:location.origin+location.pathname;return u+'?sala='+SALA}
function startDocente(){
  setInterval(fetchVotes,2000);fetchVotes();
  $('bshare').onclick=function(){
    var u=studentUrl();$('murl').textContent=u;$('mmsg').textContent='';$('qr').innerHTML='';
    try{if(window.qrcode){var q=window.qrcode(0,'M');q.addData(u);q.make();$('qr').innerHTML=q.createSvgTag(6,0)}}catch(e){}
    $('modal').classList.add('show');
  };
  $('mclose').onclick=function(){$('modal').classList.remove('show')};
  $('mcopy').onclick=function(){try{navigator.clipboard.writeText(studentUrl()).then(function(){$('mmsg').textContent='Link copiado.'},function(){$('mmsg').textContent='No se pudo copiar.'})}catch(e){$('mmsg').textContent='No se pudo copiar.'}};
  $('mclear').onclick=function(){if(confirm('¿Borrar todos los votos de la sala '+SALA+'?')){resetPolls(POLLIDS.slice());$('mmsg').textContent='Votos reiniciados.'}};
  $('modal').addEventListener('click',function(e){if(e.target===$('modal'))$('modal').classList.remove('show')});
}
if(ROL==='alumno'){startAlumno()}
else{build();cur=fromHash();render();startDocente()}
})();
</script>
</body>
